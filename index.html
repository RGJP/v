  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Cpath d='M34 66 L66 50 L34 34 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <title>Launchpad</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070c14;
      --card-bg: rgba(18, 26, 43, 0.78);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-hover: rgba(28, 42, 70, 0.96);
      --text: #f1f5f9;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100svh;
      height: var(--app-height, 100svh);
      max-height: 100svh;
      max-height: var(--app-height, 100svh);
      overflow: hidden;
      background: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #162444 0%, #070c14 80%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    /* Fullscreen Viewport Shell with Android 3-Button Nav Protection */
    .viewport-shell {
      width: 100%;
      height: 100%;
      max-height: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding-top: max(8px, env(safe-area-inset-top, 0px));
      padding-left: max(8px, env(safe-area-inset-left, 0px));
      padding-right: max(8px, env(safe-area-inset-right, 0px));
      /* Generous bottom padding for Android 3-button native navigation */
      padding-bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 10px));
      display: flex;
      flex-direction: column;
    }

    /* Grid Layout:
       - Mobile Portrait: 2 COLUMNS x 10 ROWS (Wide cards: text never truncates!)
       - Tablet / Landscape: 4 COLUMNS x 5 ROWS
       - Desktop: 5 COLUMNS x 4 ROWS
    */
    main {
      flex: 1;
      height: 100%;
      min-height: 0;
      display: grid;
      gap: clamp(4px, 0.9vh, 8px);
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(10, 1fr);
    }

    @media (min-width: 600px) {
      main {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: clamp(6px, 1.2vh, 12px);
      }
    }

    @media (min-width: 960px) {
      main {
        grid-template-columns: repeat(5, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: clamp(8px, 1.5vh, 14px);
      }
    }

    /* App Button: Horizontal card on mobile & desktop */
    .app-btn {
      position: relative;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: clamp(8px, 2vw, 14px);
      min-width: 0;
      min-height: 0;
      padding: 0 clamp(8px, 2.2vw, 16px);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: clamp(10px, 1.8vh, 15px);
      text-decoration: none;
      color: var(--text);
      user-select: none;
      outline: none;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .app-btn:last-child {
      grid-column: span 2;
    }

    /* Left accent indicator strip */
    .app-btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 18%;
      bottom: 18%;
      width: 3px;
      background: var(--accent-color, var(--accent));
      border-radius: 0 4px 4px 0;
      opacity: 0.85;
      transition: all 140ms ease;
    }

    .app-btn:hover {
      background: var(--card-hover);
      border-color: var(--accent-color, var(--accent));
      transform: translateY(-1px);
      box-shadow: 0 6px 16px -2px rgba(0, 0, 0, 0.45);
    }

    .app-btn:hover::before {
      top: 10%;
      bottom: 10%;
      width: 4px;
      opacity: 1;
      box-shadow: 0 0 10px var(--accent-color, var(--accent));
    }

    .app-btn:active {
      transform: scale(0.96);
    }

    /* Icon Squircle Box */
    .btn-icon-box {
      width: clamp(28px, 4.4vh, 38px);
      height: clamp(28px, 4.4vh, 38px);
      border-radius: clamp(8px, 1.3vh, 11px);
      background: var(--icon-bg, rgba(255, 255, 255, 0.06));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.15rem, 2.5vh, 1.55rem);
      line-height: 1;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: transform 140ms ease;
    }

    .app-btn:hover .btn-icon-box {
      transform: scale(1.08);
    }

    /* Label Container */
    .btn-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      flex: 1;
    }

    .btn-label {
      font-size: clamp(0.76rem, 1.7vh, 0.94rem);
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.15;
      text-align: left;
      white-space: normal;
      word-break: normal;
      overflow-wrap: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Ultra-compact screen adjustments (landscape / small screens) */
    @media (max-height: 540px) {
      .viewport-shell {
        gap: 3px;
        padding-bottom: max(14px, calc(env(safe-area-inset-bottom, 0px) + 6px));
      }
      .btn-icon-box {
        width: 24px;
        height: 24px;
        font-size: 1rem;
      }
      .btn-label {
        font-size: clamp(0.68rem, 1.3vh, 0.78rem);
      }
    }
  </style>
</head>

  <script>
    // Exact visual height binding for mobile address bars & Android navigation
    function updateAppHeight() {
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--app-height', `${vh}px`);
    }

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateAppHeight);
    }
    window.addEventListener('resize', updateAppHeight);
    window.addEventListener('orientationchange', () => {
      setTimeout(updateAppHeight, 100);
    });
    updateAppHeight();
  </script>
