<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b13">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%236366f1'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Cpath d='M34 66 L66 50 L34 34 Z' fill='%23ffffff'/%3E%3C/svg%3E">
  <title>Launchpad</title>
  <style>
    :root {
      --bg: #070b13;
      --text: #eef2f8;
      --muted: #8b97ab;
      --tile: rgba(20, 28, 46, 0.72);
      --tile-hover: rgba(30, 42, 68, 0.92);
      --line: rgba(255, 255, 255, 0.08);
      --gap: 8px;
      --tw: calc((100% - 2 * var(--gap)) / 3);   /* no-JS fallback: 3 x 7 */
      --th: calc((100% - 6 * var(--gap)) / 7);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: var(--bg);
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    /* The page is pinned to the visible viewport: nothing can ever scroll. */
    body {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(60vmax 45vmax at 12% -8%, rgba(56, 189, 248, 0.13), transparent 70%),
        radial-gradient(55vmax 45vmax at 95% 108%, rgba(139, 92, 246, 0.12), transparent 70%),
        var(--bg);
    }

    .shell {
      height: 100%;
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: clamp(8px, 1.6vh, 18px);
      padding:
        max(12px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, calc(env(safe-area-inset-bottom) + 8px))
        max(14px, env(safe-area-inset-left));
    }

    header {
      flex: none;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px;
      white-space: nowrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: clamp(15px, 2.1vh, 19px);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand::before {
      content: "";
      width: 0.62em;
      height: 0.62em;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.55);
    }

    .today {
      font-size: clamp(12px, 1.6vh, 14px);
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .today::first-letter { text-transform: uppercase; }

    /* Grid: JS picks the column count that gives the biggest tiles for this
       exact screen (3x7 phone portrait, 7x3 landscape, 6x4 desktop...). */
    main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      align-content: center;
      justify-content: center;
      gap: var(--gap);
      overflow: hidden;
    }

    .tile {
      --c: #38bdf8;
      container: tile / size;
      flex: none;
      width: var(--tw);
      height: var(--th);
      position: relative;
      display: block;
      color: inherit;
      text-decoration: none;
      background:
        radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--c) 10%, transparent), transparent 70%),
        var(--tile);
      border: 1px solid var(--line);
      border-radius: clamp(12px, 1.8vmin, 20px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 6px 18px -10px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      animation: rise 420ms cubic-bezier(.2, .8, .2, 1) backwards;
      animation-delay: calc(var(--i, 0) * 18ms);
    }

    .inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9cqmin;
      padding: 6cqmin 7cqi;
      text-align: center;
    }

    .icon {
      flex: none;
      width: clamp(26px, 44cqmin, 84px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 28%;
      background: color-mix(in srgb, var(--c) 20%, rgba(255, 255, 255, 0.03));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent) inset, 0 4px 14px -6px color-mix(in srgb, var(--c) 70%, transparent);
      font-size: clamp(15px, 25cqmin, 48px);
      line-height: 1;
      transition: transform 160ms ease;
    }

    .label {
      max-width: 100%;
      font-size: clamp(11px, min(12cqi, 15cqh), 17px);
      font-weight: 650;
      letter-spacing: -0.01em;
      line-height: 1.15;
      overflow-wrap: anywhere;
      hyphens: auto;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Wide, short tiles: icon beside the label instead of above it. */
    @container tile (min-aspect-ratio: 9 / 5) {
      .inner { flex-direction: row; justify-content: flex-start; gap: 12cqh; padding: 0 9cqh; text-align: left; }
      .icon { width: clamp(24px, 62cqh, 72px); font-size: clamp(14px, 35cqh, 40px); }
      .label { font-size: clamp(11px, 24cqh, 17px); }
    }

    .tile:focus { outline: none; }
    .tile:focus-visible {
      border-color: var(--c);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent);
    }

    @media (hover: hover) {
      .tile:hover {
        background-color: var(--tile-hover);
        border-color: color-mix(in srgb, var(--c) 70%, transparent);
        transform: translateY(-2px);
        box-shadow: 0 10px 26px -12px color-mix(in srgb, var(--c) 60%, transparent);
      }
      .tile:hover .icon { transform: scale(1.07); }
    }

    .tile:active { transform: scale(0.96); transition-duration: 60ms; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
    }

    /* Very short screens (phone landscape): drop the header, every pixel goes to tiles. */
    @media (max-height: 460px) {
      header { display: none; }
      .shell { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: max(8px, env(safe-area-inset-bottom)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">Launchpad</div>

    </header>

    <main id="grid">
      <a class="tile" href="balance/index.html" style="--c:#14b8a6"><span class="inner"><span class="icon" aria-hidden="true">⚖️</span><span class="label">Balance</span></span></a>

  <script>
    (() => {
      const grid = document.getElementById('grid');
      const tiles = Array.from(grid.children);
      const n = tiles.length;
      tiles.forEach((t, i) => t.style.setProperty('--i', i));

      // Date in the header
      try {
        document.getElementById('today').textContent =
          new Date().toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
      } catch (e) {}

      // Pick the columns x rows that make the largest near-square tiles fit the
      // available space exactly, so the whole launchpad is always on one screen.
      const IDEAL = 1.1; // preferred tile width / height
      function layout() {
        const W = grid.clientWidth, H = grid.clientHeight;
        if (!W || !H) return;
        const gap = Math.round(Math.max(6, Math.min(14, Math.min(W, H) * 0.02)));
        let best = null;
        for (let c = 1; c <= n; c++) {
          const r = Math.ceil(n / c);
          if (c > 1 && Math.ceil(n / (c - 1)) === r) continue; // same rows, fewer cols is strictly better
          const w = (W - (c - 1) * gap) / c;
          const h = (H - (r - 1) * gap) / r;
          if (w <= 0 || h <= 0) continue;
          const fill = n / (c * r);                       // penalise empty slots a little
          const orphan = r > 1 && n % c === 1 ? 0.8 : 1;   // avoid one lonely tile on the last row
          const score = Math.min(w, h * IDEAL) * (0.85 + 0.15 * fill) * orphan;
          if (!best || score > best.score) best = { c, r, w, h, score };
        }
        if (!best) return;
        const s = grid.style;
        s.setProperty('--gap', gap + 'px');
        s.setProperty('--tw', Math.floor(best.w * 100) / 100 - 0.01 + 'px');
        s.setProperty('--th', Math.floor(best.h * 100) / 100 - 0.01 + 'px');
      }

      layout();
      if ('ResizeObserver' in window) new ResizeObserver(layout).observe(grid);
      else addEventListener('resize', layout);
      addEventListener('orientationchange', () => setTimeout(layout, 120));
      addEventListener('pageshow', layout);
    })();
  </script>
