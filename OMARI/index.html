<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0918">
  <title>OMIRA</title>
  <meta name="description" content="OMIRA — a handcrafted 2D platformer homage. Pure HTML5 canvas and Web Audio.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <div id="frame">
      <canvas id="game" width="400" height="224" aria-label="OMIRA game screen"></canvas>
    </div>
  </main>

  <div id="toolbar">
    <button id="pause" class="tool touch-only" type="button" aria-label="Pause" title="Pause (P)">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
    </button>
    <button id="fs" class="tool" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F)">
      <svg class="icon-enter" viewBox="0 0 16 16" aria-hidden="true"><path class="line" d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
      <svg class="icon-exit" viewBox="0 0 16 16" aria-hidden="true"><path class="line" d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>
    </button>
    <button id="mute" class="tool" type="button" aria-label="Toggle sound" title="Toggle sound (M)">
      <svg class="icon-on" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path class="line" d="M11 5.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5M12.5 3.5C14 4.8 15 6.3 15 8s-1 3.2-2.5 4.5"/></svg>
      <svg class="icon-off" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h3l4-3v10L5 10H2z"/><path class="line" d="M11 6l4 4M15 6l-4 4"/></svg>
    </button>
  </div>

  <div id="touch" class="touch-only" aria-hidden="true">
    <div id="dpad"><span class="arrow l"></span><span class="arrow r"></span></div>
    <div id="btns"><span id="bB" class="btn">B</span><span id="bA" class="btn">A</span></div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="game.js"></script>
</body>
</html>
